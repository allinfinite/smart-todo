      - heading "Six Senses Douro Valley" [level=2] [ref=f27e66]
      - paragraph [ref=f27e67]: Samodães, Viseu district, Portugal | 5 star hotel
      - paragraph [ref=f27e68]: Address
      - paragraph [ref=f27e69]: Quinta Vale de Abrão, Samodães, Viseu district, 5100-758, Portugal
      - paragraph [ref=f27e70]: Description
      - paragraph [ref=f27e71]: Six Senses Douro Valley, set within a UNESCO World Heritage region, overlooks the River Douro as it meanders through the world’s oldest demarcated wine region. The estate spans 19 acres and features 50 guestrooms. Guests can enjoy three distinct dining experiences, all emphasizing regional produce, complemented by a dedicated wine cellar showcasing local vintages. The Six Senses Spa includes 10 treatment rooms, indoor and outdoor pools, and a gym, offering specialty and local therapies alongside multi-day wellness programs. An outdoor yoga pavilion provides an ideal space for individual or group sessions. Nestled in the sun-drenched valley, the resort is perfectly located to explore the region through a variety of activities and excursions by foot, vehicle, or boat.
      - paragraph [ref=f27e72]: Website
      - paragraph [ref=f27e73]: https://www.sixsenses.com/en/resorts/douro-valley/destination
