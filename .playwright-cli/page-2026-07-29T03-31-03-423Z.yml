      - heading "The Largo" [level=2] [ref=f27e97]
      - paragraph [ref=f27e98]: Porto, Portugal | 5 star hotel
      - paragraph [ref=f27e99]: Address
      - paragraph [ref=f27e100]: Largo De Sao Domingos 60, Porto, 4050-545, Portugal
      - paragraph [ref=f27e101]: Description Located in Porto’s lively Largo de Sao Domingos square, The Largo is a boutique hotel with 18 rooms housed in five interconnected buildings dating from the 15th to 19th centuries. Carefully restored to preserve original features, the hotel blends historic charm with modern design by architect Frederico Valsassina and interiors by Space Copenhagen. Since opening in 2017, The Largo has actively engaged with local cultural communities, creating authentic experiences and connections. This innovative hotel concept by Copenhagen-based Annassurra redefines luxury and is just an 8-minute walk from the Douro River. Adjacent are sister venues Cozinha das Flores and Flor, led by renowned chef Nuno Mendes, enhancing guests’ immersion in Porto’s vibrant culture.
      - paragraph [ref=f27e102]: Website
      - paragraph [ref=f27e103]: https://thelargo.com/
