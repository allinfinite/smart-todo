        - heading "Preferred relationships make the arrival feel different." [level=2] [ref=f25e61]
      - paragraph [ref=f25e62]: When you book through Relax & Roam Travel, our preferred partner perks typically include priority for room upgrades, early check-in and late check-out, a welcome amenity, VIP guest status, and a $100+ property credit to use toward dining or spa - plus other exclusive additions that simply aren't available when you book on your own.
