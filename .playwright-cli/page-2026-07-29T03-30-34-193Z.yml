  - generic [ref=f25e127]:
    - generic [ref=f25e128]:
      - generic [ref=f25e129]:
        - paragraph [ref=f25e130]: Where we start
        - heading "Every great trip begins with a conversation." [level=2] [ref=f25e131]
      - paragraph [ref=f25e132]: Before anything else, we schedule a consultation call to get to know you - how you like to travel, who's coming with you, what's been on your list forever, and what kind of experience you're really after. The more we know, the better we can design something that feels like it was made specifically for you - because it was.
    - generic [ref=f25e133]:
      - paragraph [ref=f25e134]: The process
      - heading "From first conversation to dream trip - here's what to expect." [level=2] [ref=f25e135]
    - generic [ref=f25e136]:
      - article [ref=f25e137]:
        - generic [ref=f25e138]: "01"
        - heading "Let's Talk" [level=3] [ref=f25e139]
        - paragraph [ref=f25e140]: Every great trip starts with getting to know each other. We'll dig into how you like to travel, the destinations that keep calling your name, the hotels you've been dreaming about, the needs and wishes of everyone coming along - and everything in between that makes your ideal trip uniquely yours.
      - article [ref=f25e141]:
        - generic [ref=f25e142]: "02"
        - heading "We Get to Work" [level=3] [ref=f25e143]
        - paragraph [ref=f25e144]: No more tabs, saved links, or second-guessing. We take everything you've shared and shape it into a clear plan - the right hotels, the right routing, the right experiences, in the right order.
      - article [ref=f25e145]:
        - generic [ref=f25e146]: "03"
        - heading "Book With Confidence" [level=3] [ref=f25e147]
        - paragraph [ref=f25e148]: Once the plan feels right, we handle the bookings, lock in the details, and make sure everything is organized, elevated, and ready for you to just show up and enjoy.
