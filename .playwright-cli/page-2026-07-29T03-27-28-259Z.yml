    - figure [ref=f14e18]:
      - img "Sandra Hodes" [ref=f14e19]
    - generic [ref=f14e20]:
      - paragraph [ref=f14e21]: Meet Sandra
      - heading "Some call it obsessive. I call it knowing exactly what makes a trip extraordinary." [level=2] [ref=f14e22]
      - paragraph [ref=f14e23]: I'm an attorney and founder of a boutique luxury travel agency, which means I research like it's my job - because it is. I know the difference between a good hotel and the right hotel for you, between a logical itinerary and one that actually flows - and I've spent decades traveling the world to learn exactly that.
      - paragraph [ref=f14e24]: My love of travel started early. I grew up devouring travel guides the same way I read novels, dreaming about the places I'd go. I studied in Italy, Spain, and London, fell hard for Europe, and never really came back - at least not in spirit. Italy has my heart in a way that's hard to explain to anyone who hasn't stood in a Florentine piazza at dusk or lingered over a long lunch in Tuscany.
      - paragraph [ref=f14e25]: "How do I love to travel? Immersing myself fully in a place: meandering through hidden streets, discovering local flavors and vibrant bars, and ending the day with a handcrafted cocktail at a stunning hotel bar where every detail feels effortless. Whether savoring a slow lunch in a village trattoria, hiking rugged cliffs, or finding peaceful stillness beneath ancient trees at a shrine in Japan, I've learned that travel's true magic is both movement and pause."
      - paragraph [ref=f14e26]: I'm based in South Florida and escape to the mountains of Colorado whenever I can, and I've been lucky enough to travel extensively - with friends, with my family, and on my own, always with a notebook and an eye for what actually makes a place sing. I've also traveled with my kids since they were infants, which means I know firsthand what works for families and multi-generational groups at every stage.
      - paragraph [ref=f14e27]: I'm affiliated with Fora(X) and Virtuoso - the world's leading luxury travel network - which means my clients get access to preferred partnerships, VIP amenities, and relationships with hoteliers around the world that simply can't be replicated by booking on your own. But honestly? These relationships are what I'm most proud of. When I call ahead for a client, someone picks up - and they know my name.
      - paragraph [ref=f14e28]: Everyone has their own sweet spot when it comes to travel planning - and I'm happy to meet you wherever you are. If you simply want help securing the right hotel or cruise and prefer to do your own research, I'll still bring my industry relationships to the table and make sure you're getting the VIP treatment, at no additional cost to you. And if you want more, I plan every trip as if it were my own.
      - paragraph [ref=f14e29]: If you want someone who will dig in, get it right, and stay in your corner from the first conversation to the moment you get home - let's talk.
      - generic [ref=f14e30]:
        - paragraph [ref=f14e31]: Sandra Hodes
        - generic [ref=f14e32]: Founder, Relax & Roam Travel/Fora(X)
